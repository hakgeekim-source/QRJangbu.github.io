function qquickSave(){const date=qv('date');qcheck(date);const inc=qv('dir')==='입금',a=+qv('acct'),pay=+qv('pay'),p=qv('p'),tax=qv('tax'),n=qn('amt'),dept=qv('dept'),proof=qv('proof');if(!n)throw Error('금액을 입력하세요.');if(inc&&tax==='불공제')throw Error('매출에는 불공제를 선택할 수 없습니다.');const t=tax==='과세'||tax==='불공제'?(qv('taxamt')!==''?qn('taxamt'):(tax==='과세'&&C().tax!=='일반과세자'?0:Math.sign(n)*vat(Math.abs(n)))):0;const extra={tax,proof,dept,supply:n,nondeduct:tax==='불공제'?t:0};let L=[qline(a,(inc?-1:1)*(n+(tax==='불공제'?t:0)),p,extra),qline(pay,(inc?1:-1)*(n+t),p,{dept})];if(t&&tax!=='불공제')L.push(qline(inc?255:135,(inc?-1:1)*t,p,{dept}));qpost(date,qv('memo'),L,null,inc?'입금':'출금');qsaveMsg('간이 전표를 저장했습니다.')}

function qsearch(){const R=Q.search;let L=C().vouchers.filter(v=>v.date>=(R.s||pr().s)&&v.date<=(R.e||pr().e));if(R.memo)L=L.filter(v=>(v.memo||'').includes(R.memo)||v.lines.some(l=>(l.m||'').includes(R.memo)));if(R.p)L=L.filter(v=>v.lines.some(l=>(l.p||'').includes(R.p)));if(R.acct)L=L.filter(v=>v.lines.some(l=>+l.acct===+R.acct));if(R.kind)L=L.filter(v=>(v.qkind||vkind(v))===R.kind);L=L.filter(v=>{const n=v.lines.reduce((s,l)=>s+l.d,0);return (!R.min||n>=R.min)&&(!R.max||n<=R.max)});if(R.dup){const counts={};L.forEach(v=>{const k=v.date+'|'+v.memo+'|'+v.lines.reduce((s,l)=>s+l.d,0);counts[k]=(counts[k]||0)+1});L=L.filter(v=>counts[v.date+'|'+v.memo+'|'+v.lines.reduce((s,l)=>s+l.d,0)]>1)}L.sort((a,b)=>R.order==='금액순'?b.lines.reduce((s,l)=>s+l.d,0)-a.lines.reduce((s,l)=>s+l.d,0):R.order==='최근순'?b.id-a.id:a.date.localeCompare(b.date)||a.no-b.no);LX={n:'전표검색',a:[['일자','번호','구분','적요','차변','대변'],...L.map(v=>[v.date,v.no,v.qkind||vkind(v),v.memo,v.lines.reduce((s,l)=>s+l.d,0),v.lines.reduce((s,l)=>s+l.c,0)])]};return `<div class="card"><h3>전표검색</h3><div class="row">${qinput('ss','시작일',R.s||pr().s,'date')}${qinput('se','종료일',R.e||pr().e,'date')}${qinput('smemo','적요',R.memo||'')}${qinput('sp','거래처',R.p||'')}${qselect('sacct','계정',[['','전체'],...C().accounts.map(a=>[a.code,a.code+' '+a.name])],R.acct||'')}${qselect('skind','구분',['','입금','출금','매출','매입','대체','외화','자동','가져오기'],R.kind||'')}${qinput('min','최소금액',R.min||'','number')}${qinput('max','최대금액',R.max||'','number')}${qselect('order','정렬',['일자순','최근순','금액순'],R.order||'일자순')}<label><input id="qx_dup" type="checkbox" ${R.dup?'checked':''}>이중기재 의심만</label></div><div class="row"><button class="p" onclick="qrun(()=>{Q.search={s:qv('ss'),e:qv('se'),memo:qv('smemo'),p:qv('sp'),acct:qv('sacct'),kind:qv('skind'),min:qn('min'),max:qn('max'),order:qv('order'),dup:qc('dup')}})">검색</button><button onclick="lXl()">엑셀</button><button onclick="qprintSelected()">선택 전표 출력</button><span>${L.length}건 · 중복은 후보이며 삭제 전 확인 필요</span></div>${qvoucherTable(L)}</div>`}

/* 재고 엔진 — 전표는 주기법: 입출고 원장과 결산 매출원가를 분리 */
function qproductOpen(p){return(C().stock||[]).filter(s=>s.name===p.name&&(s.spec||'')===(p.spec||'')&&+s.acct===+p.acct).reduce((o,s)=>({qty:o.qty+(+s.qty||0),amount:o.amount+(+s.amt||0)}),{qty:0,amount:0})}
function qinventory(p,en,throwShort=true){const x=qdata(),opening=qproductOpen(p),start=C().periods.reduce((s,p)=>p.s<s?p.s:s,C().periods[0].s);let qty=opening.qty,amount=opening.amount,lastCost=qty?amount/qty:0,layers=qty?[{qty,unit:lastCost}]:[],rows=[];const method=C().inv||'선입선출법';const moves=x.moves.filter(m=>m.product===p.id).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id);let averageByPeriod={};
 const calcAvg=(date)=>{const per=C().periods.find(r=>date>=r.s&&date<=r.e)||{s:start,e:date};if(averageByPeriod[per.s]!=null)return averageByPeriod[per.s];let bq=qty,ba=amount;for(const r of moves.filter(r=>r.date>=date&&r.date<=per.e&&['입고','출고반품'].includes(r.kind))){bq+=r.qty;ba+=r.kind==='입고'?(r.net||0):(r.cost||0)}return averageByPeriod[per.s]=bq?ba/bq:0};
 for(const m of moves){if(m.date>en)break;const inc=['입고','출고반품'].includes(m.kind),before=qty;let value=0;if(inc){value=m.kind==='입고'?m.net:(m.cost||Math.round(m.qty*lastCost));qty+=m.qty;amount+=value;layers.push({qty:m.qty,unit:m.qty?value/m.qty:0});}else{if(m.qty>qty+1e-8&&throwShort)throw Error(p.name+' '+m.date+': 재고 수량이 부족합니다.');if(m.kind==='입고반품'){value=m.net;let left=m.qty;while(left>1e-8&&layers.length){const n=Math.min(left,layers[0].qty);layers[0].qty-=n;left-=n;if(layers[0].qty<1e-8)layers.shift()}}else if(method.includes('선입')){let left=m.qty;while(left>1e-8&&layers.length){const n=Math.min(left,layers[0].qty);value+=n*layers[0].unit;layers[0].qty-=n;left-=n;if(layers[0].qty<1e-8)layers.shift()}}else{value=m.qty*(method.includes('총평균')?calcAvg(m.date):(qty?amount/qty:lastCost));}qty-=m.qty;value=Math.round(value);if(m.kind!=='입고반품'&&Math.abs(qty)<1e-8&&!method.includes('총평균'))value=amount;amount-=value;}if(Math.abs(qty)<1e-8){qty=0;if(!method.includes('총평균'))amount=0;layers=[]}if(qty>0)lastCost=amount/qty;rows.push({m,inQty:inc?m.qty:0,outQty:inc?0:m.qty,inAmount:inc?value:0,outAmount:inc?0:value,qty,amount,cost:value,before});}return{qty,amount,unit:qty?amount/qty:lastCost,rows}}
function qstock(){const x=qdata(),p=x.products.find(p=>p.id==Q.pick)||x.products[0];if(p)Q.pick=p.id;const form=Q.form==='product'?`<div class="card"><h3>품목 등록</h3><div class="row">${qinput('code','품목코드')}${qinput('name','품목명')}${qinput('spec','규격')}${qacct('stockacct','재고 계정',146,'A')}<button class="p" onclick="qrun(qproductSave)">등록</button></div><small>기초 재고는 기준정보 → 최초재고 등록에서 동일한 품목명·규격·재고계정으로 입력합니다.</small></div>`:'';const P=p?qinventory(p,Q.e):null;return form+`<div class="card"><div class="row"><h3>재고수불</h3><button onclick="Q.form='product';draw()">품목 등록</button>${qselect('prod','품목',x.products.map(p=>[p.id,p.code+' '+p.name]),p?.id)}<button onclick="Q.pick=+qv('prod');draw()">품목 선택</button><span>${e(C().inv)} · ${p?`잔량 ${P.qty} / 평가액 ${f(P.amount)||0}`:''}</span></div>${p?`<div class="row">${qinput('date','일자',dd(),'date')}${qselect('kind','유형',['입고','출고','폐기','망실','타계정대체','입고반품','출고반품'])}${qinput('qty','수량',1,'number','min="0.00001" step="any"')}${qinput('price','부가세 포함 단가',0,'number','min="0" step="any"')}${qpart()}${qselect('tax','세무구분',['과세','면세','영세율'],'과세')}${qacct('pay','상대계정',251)}${qacct('sale','매출계정',401,'R')}${qacct('target','타계정대체 / 손실계정',951)}${qinput('memo','메모')}</div><label><input type="checkbox" id="qx_post"> 입고/출고 매입·매출 전표 생성 (반품·폐기·망실·대체는 자동)</label><div class="row"><button class="p" onclick="qrun(qmoveSave)">기록</button><button onclick="qrun(qrecalc)">출고원가 재계산</button><button onclick="qrun(()=>{const p=qdata().products.find(p=>p.id==Q.pick);p.use=p.use===false;})">선택 품목 사용 전환</button></div>${qtable(['일자','유형','수량','금액(원가)','잔량','잔액','자동전표','작업'],P.rows.map(r=>[r.m.date,e(r.m.kind),r.m.qty,f(r.cost),r.qty,f(r.amount),r.m.voucher||'—',`<button onclick="qrun(()=>qmoveDelete(${r.m.id}))">삭제</button>`]),true)}`:'<p>품목을 등록하세요.</p>'}</div>${qnotice('출고 판매가격은 선택사항입니다. 재고 출고원가는 결산에서 매출원가로 대체됩니다. 입고반품은 매입취소 단가, 출고반품은 원거래 원가를 확인하세요. 과거 자료 삭제/수정 후 출고원가 재계산을 실행하세요. 총평균의 과거 잔액은 기말 재계산 기준 잠정값입니다.')}`}
function qproductSave(){const x=qdata(),name=qv('name').trim(),code=qv('code').trim();if(!name||!code)throw Error('품목명과 코드를 입력하세요.');if(x.products.some(p=>p.code===code))throw Error('중복 품목코드입니다.');x.products.push({id:qid(),code,name,spec:qv('spec'),acct:+qv('stockacct'),use:true});Q.pick=x.products.at(-1).id;Q.form=''}
function qmoveSave(){const x=qdata(),p=x.products.find(p=>p.id==Q.pick);if(!p||p.use===false)throw Error('사용 가능한 품목을 선택하세요.');qcheck(qv('date'));if(qn('qty')<=0||qn('price')<0)throw Error('수량은 양수, 단가는 0 이상이어야 합니다.');const kind=qv('kind'),qty=qn('qty'),total=Math.round(qty*qn('price')),tax=qv('tax'),t=tax==='과세'&&C().tax==='일반과세자'?Math.floor(total/11):0,net=total-t,id=qid(),group='stock:'+id,before=qinventory(p,qv('date'));const m={id,group,product:p.id,date:qv('date'),kind,qty,price:qn('price'),net,tax,taxAmount:t,p:qv('p'),pay:+qv('pay'),sale:+qv('sale'),target:+qv('target'),memo:qv('memo'),cost:Math.round(qty*before.unit),post:qc('post')};if(['입고','입고반품'].includes(kind)&&!total)throw Error('매입/반품 단가를 입력하세요.');x.moves.push(m);try{qinventory(p,pr().e);qmovePost(m)}catch(err){x.moves=x.moves.filter(r=>r.id!==id);qundo(group);throw err}qsaveMsg('수불 기록을 저장했습니다.')}
function qmovePost(m){const p=qdata().products.find(p=>p.id===m.product),r=qinventory(p,pr().e).rows.find(r=>r.m.id===m.id);if(!r)return;let L=[];const meta={tax:m.tax,supply:m.net,proof:'기타'};if(m.kind==='입고'&&m.post||m.kind==='입고반품'){const sign=m.kind==='입고'?1:-1;L=[qline(p.acct,sign*m.net,m.p,meta),qline(m.pay,-sign*(m.net+m.taxAmount),m.p)];if(m.taxAmount)L.push(qline(135,sign*m.taxAmount,m.p));}else if(m.kind==='출고'&&m.post||m.kind==='출고반품'){const sign=m.kind==='출고'?1:-1;if(!m.net&&m.kind==='출고반품')throw Error('출고반품은 판매취소 단가를 입력하세요.');if(m.net){L=[qline(m.pay,sign*(m.net+m.taxAmount),m.p),qline(m.sale,-sign*m.net,m.p,meta)];if(m.taxAmount)L.push(qline(255,-sign*m.taxAmount,m.p));}}else if(['폐기','망실','타계정대체'].includes(m.kind)){const loss=m.kind==='타계정대체'?m.target:(C().scrap||'').includes('정상(')?qa(459,'재고감모원가','X'):qa(959,'재고자산감모손실','X');L=[qline(loss,r.cost,m.p),qline(p.acct,-r.cost,m.p)];}if(L.length&&L.some(l=>l.d||l.c))m.voucher=qpost(m.date,'재고 '+m.kind+' '+p.name+' '+m.memo,L,m.group).no}
function qmoveDelete(id){const x=qdata(),m=x.moves.find(m=>m.id===id);if(!m)return;qcheck(m.date);if(!confirm('수불 기록과 연결 전표를 삭제할까요?'))return;const old=x.moves;x.moves=old.filter(m=>m.id!==id);try{qinventory(x.products.find(p=>p.id===m.product),pr().e)}catch(e){x.moves=old;throw e}qundo(m.group)}
function qrecalc(){const x=qdata(),mov=x.moves.filter(m=>inP(m.date)&&['폐기','망실','타계정대체'].includes(m.kind));x.products.forEach(p=>qinventory(p,pr().e));if(mov.some(m=>qclosed(m.date)))throw Error('마감 해제 후 재계산하세요.');mov.forEach(m=>{qundo(m.group);qmovePost(m)});qsaveMsg(mov.length+'건 원가 자동전표 재계산 완료')}
function qstockLedger(){const x=qdata(),summary=[],detail=[];x.products.forEach(p=>{const at=qinventory(p,Q.e),b=at.rows.filter(r=>r.m.date>=Q.s),opening=qinventory(p,ymd(new Date(pd(Q.s).getFullYear(),pd(Q.s).getMonth(),pd(Q.s).getDate()-1)));summary.push([p.code,p.name,p.acct,opening.qty,opening.amount,b.reduce((s,r)=>s+r.inQty,0),b.reduce((s,r)=>s+r.inAmount,0),b.reduce((s,r)=>s+r.outQty,0),b.reduce((s,r)=>s+r.outAmount,0),at.qty,at.amount]);b.forEach(r=>detail.push([r.m.date,p.code,p.name,r.m.kind,r.m.p,r.inQty,r.outQty,r.cost,r.qty,r.amount,r.m.voucher||'']))});const h=['품목코드','품목','계정','기초수량','기초금액','입고수량','입고금액','출고수량','출고금액','기말수량','기말금액'];LX={n:'재고수불부',a:[h,...summary,[],['일자','코드','품목','유형','거래처','입고','출고','원가','잔량','잔액','전표'],...detail]};return qperiod()+`<div class="card"><h3>재고수불부 · 요약</h3>${qtable(h,summary)}<h3>이동 상세</h3>${qtable(['일자','코드','품목','유형','거래처','입고','출고','원가','잔량','잔액','전표'],detail)}</div>`}

/* 자산 — 회계상 월할 관리, 세법별 상각한도는 별도 검토 */
function qassetValues(a,en){let dep=+a.openDep||0,change=0;C().vouchers.filter(v=>v.date<=en&&v.qgroup?.startsWith('asset:'+a.id+':')).forEach(v=>v.lines.forEach(l=>{if(+l.acct===+a.accum)dep+=(+l.c||0)-(+l.d||0);if(+l.acct===+a.acct&&v.qassetChange)change+=(+l.d||0)-(+l.c||0)}));return{dep,change,cost:a.cost,book:Math.max(0,a.cost+change-dep)}}
function qassetAnnual(a,year){const cost=a.cost+(a.capital||[]).filter(x=>x.date<=year+'-12-31').reduce((s,r)=>s+r.amount,0),residual=a.residual||0,rate=a.rate||1/a.life;const acq=pd(a.date);let book=cost-(+a.openDep||0);const first=+a.startYear||acq.getFullYear();for(let y=first;y<year;y++){const months=y===acq.getFullYear()?12-acq.getMonth():12;const amount=a.method==='정액법'?(cost-residual)/a.life*months/12:book*rate*months/12;book=Math.max(residual,book-amount)}const full=a.method==='정액법'?(cost-residual)/a.life:book*rate;return Math.max(0,Math.min(book-residual,full))}
function qassetSchedule(a,s,en){if(a.disposed&&a.disposed.date<s)return[];const stop=a.disposed&&a.disposed.date<en?a.disposed.date:en,start=a.date>s?a.date:s,rows=[];if(start>stop)return rows;const dt=pd(start);for(let d=new Date(dt.getFullYear(),dt.getMonth(),1);ymd(d)<=stop;d=new Date(d.getFullYear(),d.getMonth()+1,1)){const y=d.getFullYear(),m=d.getMonth(),date=ymd(new Date(y,m+1,0));if(date>stop)continue;const annual=qassetAnnual(a,y),amount=Math.round(annual/12);if(amount>0)rows.push({date,amount})}return rows}
function qassets(){const x=qdata();let form='';if(Q.form==='asset'){form=`<div class="card"><h3>자산 등록</h3><div class="row">${qinput('name','자산명')}${qselect('class','분류',['유형자산','무형자산','토지(비상각)'])}${qinput('date','취득일',dd(),'date')}${qinput('cost','본체 취득가액',0,'number')}${qinput('expense','부대비용',0,'number')}${qinput('residual','잔존가액',0,'number')}${qselect('method','상각방법',['정액법','정률법'])}${qinput('life','내용연수(년)',5,'number','min="1"')}${qinput('rate','정률법 연 상각률 (0~1)',0.4,'number','step="0.001"')}${qinput('openDep','도입 전 상각누계',0,'number')}${qinput('startYear','도입연도(기상각 반영 시)',pr().fy||pd(pr().s).getFullYear(),'number')}${qacct('acct','자산 계정',212,'A')}${qacct('depexp','감가상각비 계정',qa(825,'감가상각비','X'),'X')}${qacct('accum','상각누계액 계정',qa(218,'감가상각누계액','A'),'AL')}${qacct('pay','지급 계정',103)}${qinput('vat','취득 부가세(별도)',0,'number')}<label><input type="checkbox" id="qx_acquire"> 취득 전표 자동 생성</label><button class="p" onclick="qrun(qassetSave)">저장</button></div></div>`;}return form+`<div class="card"><div class="row"><h3>유·무형자산</h3><button onclick="Q.form='asset';draw()">자산 추가</button>${qselect('unit','반영 단위',['연단위','월단위'],Q.assetUnit)}<button onclick="qassetPreview()">상각 미리보기</button><button class="p" onclick="qrun(()=>qassetDepreciate())">상각비 일괄 반영</button></div>${qtable(['자산명','종류','취득일','취득원가','기상각누계','장부금액','상태','작업'],x.assets.map(a=>{const v=qassetValues(a,pr().e);return[e(a.name),e(a.class),a.date,f(a.cost),f(v.dep),f(a.disposed&&a.disposed.date<=pr().e?0:v.book),a.disposed?'처분':'사용중',`<button onclick="qrun(()=>qassetDepreciate(${a.id}))">상각</button> <button onclick="qassetAction(${a.id},'매각')">매각</button> <button onclick="qassetAction(${a.id},'폐기')">폐기</button> <button onclick="qassetAction(${a.id},'자본적지출')">자본적지출</button> <button onclick="qassetAction(${a.id},'손상')">손상</button> <button onclick="qassetAction(${a.id},'손상환입')">손상환입</button> <button onclick="qassetUndoList(${a.id})">관련분개/되돌리기</button>`]}),true)}</div>${qnotice('회계 관리용 월할 상각입니다. 정률 상각률은 사용자가 지정하며 세법상 상각한도·월중 일할·재평가잉여금 처리는 별도 검토가 필요합니다. 도입 전 보유 자산은 최초잔액도 함께 맞추세요.')}`}
function qassetSave(){const date=qv('date'),cost=qn('cost')+qn('expense'),life=qn('life'),openDep=qn('openDep'),residual=qn('residual');if(!qv('name')||!date||cost<=0||life<=0||openDep<0||residual<0||openDep+residual>cost||qn('rate')<0||qn('rate')>1)throw Error('자산명·취득금액·내용연수·잔존가액·기상각액을 확인하세요.');const a={id:qid(),name:qv('name'),class:qv('class'),date,cost,residual,method:qv('method'),life,rate:qn('rate'),openDep,startYear:qn('startYear'),acct:+qv('acct'),expense:+qv('depexp'),accum:+qv('accum'),capital:[]};if(qc('acquire')){qcheck(date);const t=qn('vat');if(t<0)throw Error('부가세를 확인하세요.');const L=[qline(a.acct,cost,'',{tax:t?'과세':'면세',supply:cost,proof:'세금계산서'}),qline(+qv('pay'),-cost-t)];if(t)L.push(qline(135,t));qpost(date,'자산 취득 '+a.name,L,'asset:'+a.id+':acquire')}qdata().assets.push(a);Q.form=''}
function qassetPreview(){try{const rows=qdata().assets.map(a=>[a.name,a.class==='토지(비상각)'?0:qassetSchedule(a,pr().s,pr().e).reduce((s,r)=>s+r.amount,0)]);Q.message='당기 예정 상각: '+rows.map(r=>r[0]+' '+f(r[1])+'원').join(' / ');draw()}catch(e){alert(e.message)}}
function qassetDepreciate(id){qcheck(pr().e);const assets=qdata().assets.filter(a=>!id||a.id===id),unit=qv('unit')||Q.assetUnit;Q.assetUnit=unit;let count=0;assets.forEach(a=>{if(a.class==='토지(비상각)')return;const schedule=qassetSchedule(a,pr().s,pr().e),group='asset:'+a.id+':dep:'+pr().no;if(C().vouchers.some(v=>v.qgroup===group))return;const avail=Math.max(0,qassetValues(a,pr().e).book-a.residual),total=schedule.reduce((s,r)=>s+r.amount,0);if(total<=0)return;if(unit==='연단위'){const n=Math.min(total,avail);if(n)qpost(pr().e,'감가상각 '+a.name,[qline(a.expense,n),qline(a.accum,-n)],group)}else{let left=avail;schedule.forEach(r=>{const n=Math.min(left,r.amount);if(n){qpost(r.date,'월 감가상각 '+a.name,[qline(a.expense,n),qline(a.accum,-n)],group);left-=n}})}count++});qsaveMsg(count+'개 자산 상각 반영 (기반영 자산 제외)')}
function qassetAction(id,kind){const a=qdata().assets.find(a=>a.id===id);if(!a)return;Q.form='assetAction';Q.pick=id;let html=`<div class="card"><h3>${e(kind)} · ${e(a.name)}</h3><div class="row">${qinput('date','처리일',dd(),'date')}${qinput('amount','금액(매각은 공급가액)',0,'number')}${qinput('tax','매각 세액(별도)',0,'number')}${qacct('pay','상대계정',103)}<button class="p" onclick="qrun(()=>qassetActionSave(${id},'${kind}'))">확정</button><button onclick="draw()">취소</button></div></div>`;g('main').insertAdjacentHTML('afterbegin',html)}
function qassetActionSave(id,kind){const a=qdata().assets.find(a=>a.id===id),date=qv('date'),n=qn('amount'),tax=qn('tax'),pay=+qv('pay');qcheck(date);if(date<a.date||n<0||tax<0||a.disposed)throw Error('취득일 이후의 유효한 금액과 사용 중 자산을 확인하세요.');const v=qassetValues(a,date),group='asset:'+a.id+':'+qid();let L=[];if(kind==='자본적지출'){if(!n)throw Error('금액을 입력하세요.');L=[qline(a.acct,n),qline(pay,-n)];a.capital.push({date,amount:n,group});}else if(kind==='손상'||kind==='손상환입'){if(!n||kind==='손상'&&n>v.book)throw Error('손상 금액은 장부금액 이내여야 합니다.');const s=kind==='손상'?1:-1;if(kind==='손상환입'&&n>Math.max(0,-v.change))throw Error('기존 손상액 범위에서 환입하세요.');L=[qline(qa(957,'자산손상차손','X'),s*n),qline(a.acct,-s*n)];}else{const revenue=kind==='매각'?n:0,cost=a.cost+v.change,net=cost-v.dep;L=[qline(a.acct,-cost),qline(a.accum,v.dep)];if(revenue||tax)L.push(qline(pay,revenue+tax));if(tax)L.push(qline(255,-tax));const diff=net-revenue;if(diff)L.push(qline(diff>0?qa(956,'유형자산처분손실','X'):qa(911,'유형자산처분이익','R'),diff));}const post=qpost(date,kind+' '+a.name,L,group);if(['자본적지출','손상','손상환입'].includes(kind))post.qassetChange=true;else a.disposed={date,amount:n,group};qsaveMsg(kind+' 처리 완료')}
function qassetUndoList(id){const a=qdata().assets.find(a=>a.id===id);const groups=[...new Set(C().vouchers.filter(v=>v.qgroup?.startsWith('asset:'+id+':')).map(v=>v.qgroup))];if(!groups.length)return alert('관련 전표가 없습니다.');g('main').insertAdjacentHTML('afterbegin',`<div class="card"><h3>${e(a.name)} 관련 분개</h3>${groups.map((gr,i)=>{const v=C().vouchers.find(v=>v.qgroup===gr);return `<p>${e(v.date+' '+v.memo)} <button onclick="qrun(()=>qassetUndo(${id},${i}))">해당 묶음 되돌리기</button></p>`}).join('')}</div>`)}
function qassetUndo(id,index){const a=qdata().assets.find(a=>a.id===id),groups=[...new Set(C().vouchers.filter(v=>v.qgroup?.startsWith('asset:'+id+':')).map(v=>v.qgroup))],group=groups[index];if(!group)return;if(!confirm('연결된 자산 전표 묶음을 되돌릴까요?'))return;qundo(group);if(a.disposed?.group===group)delete a.disposed;a.capital=(a.capital||[]).filter(r=>r.group!==group)}
function qassetLedger(){const before=ymd(new Date(pd(Q.s).getFullYear(),pd(Q.s).getMonth(),pd(Q.s).getDate()-1)),rows=qdata().assets.filter(a=>a.date<=Q.e).map(a=>{const p=qassetValues(a,before),v=qassetValues(a,Q.e);return[a.class,a.name,a.date,a.cost,a.disposed?.date||'',a.disposed?.amount||'',a.class==='토지(비상각)'?'비상각':a.method,a.life,a.method==='정액법'?1/a.life:a.rate,p.dep,v.dep-p.dep,v.dep,v.change,a.disposed&&a.disposed.date<=Q.e?0:v.book]});return qperiod()+qreport('자산대장',['종류','자산명','취득일','취득금액','처분일','처분금액','상각방법','내용연수','연율','전기누계','당기상각','누계','자본지출·손상','장부금액'],rows)}
/* 외화 — 개별 채권/채무 항목과 원화 장부액 추적 */
function qfxBalance(a,date){let qty=a.qty,book=a.original;for(const r of (a.events||[]).filter(r=>r.date<=date).sort((a,b)=>a.date.localeCompare(b.date)||a.id-b.id)){if(r.kind==='settle'){qty-=r.qty;book-=r.carry}else book+=r.diff}return{qty,book,rate:qty?book/qty:0}}
function qforex(){const x=qdata();return `<div class="card"><h3>외화거래 발생</h3><div class="row">${qinput('date','일자',dd(),'date')}${qselect('side','구분',['외화채권','외화채무'])}${qselect('currency','통화',['USD','EUR','JPY','CNY','GBP','AUD','CAD'])}${qinput('qty','외화 원금',0,'number','step="any" min="0"')}${qinput('rate','환율(외화 1단위당 원)',1,'number','step="any" min="0"')}${qacct('acct','외화 채권·채무 계정',108,'AL')}${qacct('counter','상대계정',401)}${qpart()}${qinput('memo','적요')}<button class="p" onclick="qrun(qfxSave)">발생 전표 생성</button></div><p class="mute">JPY도 1엔당 환율을 입력하세요 (100엔 고시환율 ÷ 100).</p></div><div class="card"><h3>미결제 항목 · 기말평가 / 후속거래</h3>${qtable(['통화','발생일','계정 / 거래처','잔액(외화)','장부액','장부환율','작업'],x.fx.map(a=>{const b=qfxBalance(a,pr().e);return[a.currency,a.date,e(acc(a.acct).name+' / '+a.p),b.qty,f(b.book),b.rate.toFixed(4),`<button onclick="qfxForm(${a.id},'settle')">결제</button> <button onclick="qfxForm(${a.id},'value')">기말평가</button> <button onclick="qfxUndoForm(${a.id})">이력/되돌리기</button>`]}),true)}</div>${qnotice('외화 환산 = 외화금액 × 환율, 원 단위 반올림. 기말평가와 결제는 날짜 순으로 처리하세요. 회사 정책에서 다음 날 자동 환원을 선택한 경우 역분개가 함께 만들어집니다. 다른 기수에 걸친 환원은 해당 기수 생성 후 가능합니다.')}`}
function qfxSave(){const date=qv('date');qcheck(date);const qty=qn('qty'),rate=qn('rate'),side=qv('side')==='외화채권'?'A':'L',acct=+qv('acct');if(qty<=0||rate<=0||acc(acct).type!==side)throw Error('외화 원금·환율은 양수, 채권은 자산/채무는 부채 계정이어야 합니다.');const id=qid(),original=Math.round(qty*rate),a={id,date,side,acct,currency:qv('currency'),qty,rate,original,p:qv('p'),events:[]},dir=side==='A'?1:-1;qpost(date,'외화 발생 '+a.currency+' '+qty+' @'+rate+' '+qv('memo'),[qline(acct,dir*original,a.p,{currency:a.currency,foreign:dir*qty,rate}),qline(+qv('counter'),-dir*original,a.p)],'fx:'+id+':start','외화');qdata().fx.push(a);qsaveMsg('외화 발생 기록 저장')}
function qfxForm(id,kind){const a=qdata().fx.find(a=>a.id===id),b=qfxBalance(a,pr().e);g('main').insertAdjacentHTML('afterbegin',`<div class="card"><h3>${kind==='settle'?'외화 결제':'기말평가'} · ${a.currency} ${e(a.p)}</h3><div class="row">${qinput('date','처리일',kind==='value'?pr().e:dd(),'date')}${qinput('qty','결제 외화(평가는 무시)',b.qty,'number','step="any"')}${qinput('rate','결제 / 마감 환율',b.rate,'number','step="any"')}${qacct('pay','결제 계정',103)}<button class="p" onclick="qrun(()=>qfxAction(${id},'${kind}'))">확정</button><button onclick="draw()">취소</button></div></div>`)}
function qfxAction(id,kind){const a=qdata().fx.find(a=>a.id===id),date=qv('date'),rate=qn('rate');qcheck(date);if(date<a.date||a.events.some(r=>r.date>date))throw Error('발생/후속거래 순서대로 처리하세요. 뒤 날짜 이력을 먼저 되돌리세요.');if(rate<=0)throw Error('환율은 양수여야 합니다.');const b=qfxBalance(a,date),dir=a.side==='A'?1:-1,group='fx:'+id+':'+qid();if(b.qty<=1e-8)throw Error('미결제 외화가 없습니다.');if(kind==='settle'){const qty=qn('qty');if(qty<=0||qty>b.qty+1e-8)throw Error('결제 외화금액이 잔액 범위를 벗어났습니다.');const carry=Math.round(b.book*qty/b.qty),actual=Math.round(qty*rate),diff=dir*(actual-carry),L=[qline(a.acct,-dir*carry,a.p,{currency:a.currency,foreign:-dir*qty,rate:b.rate}),qline(+qv('pay'),dir*actual,a.p)];if(diff)L.push(qline(diff>0?qa(907,'외환차익','R'):qa(952,'외환차손','X'),-diff,a.p));qpost(date,'외화 결제 '+a.currency+' '+qty+' @'+rate,L,group,'외화');a.events.push({id:qid(),date,kind,qty,carry,actual,group});}else{const diff=Math.round(b.qty*rate)-b.book;if(!diff)throw Error('평가차액이 0원입니다.');const gain=dir*diff;const L=[qline(a.acct,dir*diff,a.p),qline(gain>0?qa(910,'외화환산이익','R'):qa(955,'외화환산손실','X'),-gain,a.p)];let next='';if(C().fx==='다음 날 자동 환원'){const d=pd(date);d.setDate(d.getDate()+1);next=ymd(d);if(!C().periods.some(p=>next>=p.s&&next<=p.e))throw Error('다음 날 환원분개를 위해 다음 기수를 먼저 만드세요.');if(qclosed(next))throw Error('환원분개 일자의 기수가 마감되어 있습니다.');}qpost(date,'외화 기말평가 '+a.currency,L,group,'외화');a.events.push({id:qid(),date,kind:'value',diff,group});if(next){const oldNo=C().curNo,p=C().periods.find(p=>next>=p.s&&next<=p.e);try{C().curNo=p.no;qpost(next,'외화평가 자동환원',L.map(l=>({...l,d:l.c,c:l.d})),group,'외화');a.events.push({id:qid(),date:next,kind:'reverse',diff:-diff,group})}finally{C().curNo=oldNo}}}qsaveMsg('외화 '+(kind==='settle'?'결제':'평가')+' 저장')}

function qfxUndo(id){const a=qdata().fx.find(a=>a.id===id),r=a.events.at(-1);if(!confirm('마지막 외화 거래(평가/환원은 함께)를 되돌릴까요?'))return;if(r){qundo(r.group);a.events=a.events.filter(e=>e.group!==r.group)}else{qundo('fx:'+id+':start');qdata().fx=qdata().fx.filter(r=>r.id!==id)}}

function qfund(){const cash=C().accounts.filter(a=>a.type==='A'&&(/현금|예금|적금|전도금|단기금융/.test(a.name)||[101,103].includes(+a.code))),codes=cash.map(a=>+a.code),rows=[],detail=[];cash.forEach(a=>{const opening=bal0([+a.code],Q.s),L=lnQ(l=>+l.acct===+a.code,Q.s,Q.e);let inc=0,out=0;L.forEach(({v,l})=>{inc+=+l.d||0;out+=+l.c||0;detail.push([v.date,v.no,a.name,l.m||v.memo,l.p||'',l.d||0,l.c||0])});rows.push([a.code,a.name,opening,inc,out,opening+inc-out])});const h=['계정코드','계정','전일마감잔액','증가액','감소액','당일마감잔액'],D=['일자','전표번호','계정','적요','거래처','입금','출금'];LX={n:'자금일보',a:[h,...rows,[],D,...detail]};return qperiod()+`<div class="card"><div class="qxapproval">작성 __________ 검토 __________ 승인 __________</div><h3>자금일보 · ${e(C().name)}</h3>${qtable(h,rows)}<h3>입·출금 내역</h3>${qtable(D,detail)}</div>`}
function qtaxOf(l,v){if(l.tax||l.tx)return l.tax||l.tx;if(v.imp&&typeof v.imp==='object'&&v.imp.tx)return v.imp.tx;if(/^매입 |^매출 /.test(v.memo||'')&&![135,255,101,103,108,251,253].includes(+l.acct))return v.lines.some(l=>[135,255].includes(+l.acct))?'과세':'면세';return ''}
function qtaxRows(s,en){const rows=[],issues=[];C().vouchers.filter(v=>v.date>=s&&v.date<=en).forEach(v=>{const bases=v.lines.filter(l=>![135,255].includes(+l.acct)&&qtaxOf(l,v));const tagged=bases.map(l=>{const tax=qtaxOf(l,v),sale=acc(l.acct).type==='R',sign=sale?l.c-l.d:l.d-l.c,nondeduct=+l.nondeduct||0;return{l,tax,sale,sign,supply:l.supply!=null?+l.supply:sign-nondeduct,nondeduct}});const pool={sale:v.lines.filter(l=>+l.acct===255).reduce((s,l)=>s+l.c-l.d,0),purchase:v.lines.filter(l=>+l.acct===135).reduce((s,l)=>s+l.d-l.c,0)};const weights={sale:tagged.filter(r=>r.sale&&r.tax==='과세').reduce((s,r)=>s+Math.abs(r.supply),0),purchase:tagged.filter(r=>!r.sale&&r.tax==='과세').reduce((s,r)=>s+Math.abs(r.supply),0)};tagged.forEach(r=>{const side=r.sale?'sale':'purchase',t=r.tax==='과세'&&weights[side]?Math.round(pool[side]*Math.abs(r.supply)/weights[side]):0;rows.push({v,l:r.l,tax:r.tax,sale:r.sale,supply:r.supply,vat:t,nondeduct:r.nondeduct,proof:r.l.proof||'미지정'})});if(!bases.length&&v.lines.some(l=>[135,255].includes(+l.acct)))issues.push([v.date,v.no,v.memo,'부가세 계정은 있으나 세무구분 미기재']);const sum=tagged.reduce((s,r)=>s+(r.tax==='과세'?1:0),0);if(sum&&pool.sale===0&&pool.purchase===0&&C().tax==='일반과세자')issues.push([v.date,v.no,v.memo,'과세 표시이나 세액 없음 (정상 여부 확인)']);});return{rows,issues}}
function qsimple(){if(C().type==='법인')return qnotice('간편장부는 개인사업자용입니다. 기준정보 → 회사/회기에서 개인사업자를 선택하세요.');const t=qtaxRows(Q.s,Q.e).rows,rows=[];lnQ(l=>{const a=acc(l.acct);return a.type==='R'||a.type==='X'||a.type==='A'&&/비품|건물|기계|장치|무형|차량/.test(a.name)},Q.s,Q.e).forEach(({v,l})=>{const a=acc(l.acct),r=t.find(r=>r.v.id===v.id&&r.l===l),n=r?r.supply:(a.type==='R'?l.c-l.d:l.d-l.c),vat=r?r.vat:0;rows.push([v.date,a.name,l.m||v.memo,l.p||'',a.type==='R'?n:0,a.type==='R'?vat:0,a.type==='X'?n:0,a.type==='X'?vat:0,a.type==='A'?n:0,a.type==='A'?vat:0,l.proof||''])});return qperiod()+qreport('간편장부',['일자','계정','거래내용','거래처','수입','수입부가세','비용','비용부가세','사업용자산','자산부가세','증빙'],rows,qnotice('내부 관리용 분류입니다. 과거 전표의 세무정보 누락은 전표 입력에서 보완해야 합니다.'))}
var QVATVIEW='세무구분별';
function qvat(){const data=qtaxRows(Q.s,Q.e),g={};data.rows.forEach(r=>{const k=(r.sale?'매출':'매입')+'|'+(QVATVIEW==='세무구분별'?r.tax:r.proof),o=g[k]||(g[k]={s:0,v:0,n:0});o.s+=r.supply;o.v+=r.vat;o.n+=r.nondeduct});const rows=Object.entries(g).map(([k,r])=>[...k.split('|'),r.s,r.v,r.n]),out=data.rows.filter(r=>r.sale).reduce((s,r)=>s+r.vat,0),inp=data.rows.filter(r=>!r.sale&&r.tax!=='불공제').reduce((s,r)=>s+r.vat,0);rows.push(['합계','매출세액 − 공제매입세액','',out-inp,'']);return qperiod()+`<div class="row">${qselect('view','보기',['세무구분별','신고서 칸(증빙별)'],QVATVIEW)}<button onclick="QVATVIEW=qv('view');draw()">보기 변경</button><span>${e(C().tax)}</span></div>`+qreport('부가세 집계표',['구분','세무 / 증빙','과세표준','세액','불공제 세액'],rows,qnotice('예상 납부(환급)세액 '+(f(out-inp)||0)+'원 · 공제한도·가산세·간이과세 업종별 계산은 반영하지 않습니다. 전자신고 파일이 아닙니다.'))+`<div class="card"><h3>집계에서 빠지거나 어긋난 전표</h3>${qtable(['일자','번호','적요','확인 사유'],data.issues)}</div>`}
function qincome(){if(C().type==='법인')return qnotice('종합소득세 명세서는 개인사업자용입니다.');const m=rangeSums(Q.s,Q.e),rows=[];let R=0,X=0;C().accounts.filter(a=>'RX'.includes(a.type)).forEach(a=>{const n=net(a,m);if(!n)return;const ex=/기부금|소득세비용|법인세비용/.test(a.name)||a.type==='R'&&/이자수익|배당/.test(a.name);if(!ex){if(a.type==='R')R+=n;else X+=n}rows.push([a.type==='R'?'총수입금액':'필요경비',a.code,a.name,n,ex?'합계 제외':'포함'])});rows.push(['총수입금액','','',R,''],['필요경비','','',X,''],['소득금액','','',R-X,'']);return qperiod()+qreport('종합소득세 명세서',['분류','코드','항목','금액','합계 반영'],rows,qnotice('내부 검토용 명세입니다. 표준 신고항목 전체 매핑·세무조정·공제·누진세율 계산은 포함하지 않습니다.'))}
function qopenItems(en){const result=[],c=C(),eligible=c.accounts.filter(a=>a.pm&&'AL'.includes(a.type));eligible.forEach(a=>{const partners=new Set([...c.partners,...Object.keys(c.obp||{}).map(k=>k.slice(k.indexOf('|')+1))]);partners.forEach(p=>{const dir=a.type==='A'?1:-1,ob=dir*(+(c.obp||{})[a.code+'|'+p]||0),events=[];if(ob)events.push({date:c.periods[0].s,no:'기초',id:'opening:'+a.code+':'+p,amount:ob});lnQ(l=>+l.acct===+a.code&&l.p===p,c.periods[0].s,en).forEach(({v,l,i})=>events.push({date:v.date,no:v.no,id:v.id+':'+i,amount:dir*(l.d-l.c),v}));let credit=0,queue=[];events.sort((a,b)=>a.date.localeCompare(b.date)).forEach(ev=>{if(ev.amount>0){let n=ev.amount,offset=Math.min(credit,n);credit-=offset;n-=offset;if(n>0)queue.push({...ev,principal:ev.amount,balance:n})}else{let pay=-ev.amount;queue.forEach(o=>{const n=Math.min(pay,o.balance);o.balance-=n;pay-=n});credit+=pay}});queue.filter(o=>o.balance>0.001).forEach(o=>result.push({...o,acct:a.code,p,side:a.type,days:Math.max(0,Math.floor((pd(en)-pd(o.date))/86400000))}));if(credit>0.001)result.push({id:'credit:'+a.code+':'+p,date:en,acct:a.code,p,side:a.type,principal:-credit,balance:-credit,days:0,no:'선수·선급'})})});return result}
function qaging(){const L=qopenItems(Q.e),h=['기표일','전표','계정','거래처','원금','잔액','상태','경과일','연령 구간','기한','메모'];const vals=L.map(o=>{const meta=qdata().aging[o.id]||{};return[o.date,o.no,acc(o.acct).name,o.p,o.principal,o.balance,o.balance<0?'선수/선급':o.balance<o.principal?'부분상환':'미상환',o.days,o.days<=30?'0~30일':o.days<=60?'31~60일':o.days<=90?'61~90일':'90일 초과',meta.due||'',meta.memo||'']});LX={n:'채권채무관리',a:[h,...vals]};return qperiod()+qnotice('동일 계정·거래처별 오래된 발생건부터 상환액을 차감합니다(FIFO). 기초 거래처 잔액도 포함합니다. 결제 전표는 전표 입력에서 작성하세요.')+`<div class="card"><h3>채권 / 채무 관리</h3>${qtable([...h,'관리'],vals.map((row,i)=>[...row.map(e),`<button onclick="qagingEdit(${i})">기한·메모</button>`]),true)}</div>`}

function qcloseRun(i){const st=qcloseState();qcheck(pr().e);if(st.steps[i]&&st.steps[i]!=='수기 확인')throw Error('이미 처리된 단계입니다. 되돌린 후 재실행하세요.');const m=qbalance(pr().e),n=code=>net(acc(code),m),group='close:'+pr().no+':'+i;let L=[];if(i===3){const backup=JSON.parse(JSON.stringify(C().vouchers));try{qcloseInventory()}catch(err){C().vouchers=backup;throw err}st.steps[i]='자동분개';return;}if(i===1){const a=+qv('material'),actual=qn('actual'),difference=n(a)-actual,loss=qn('loss');if(actual<0||loss<0||loss>Math.max(difference,0))throw Error('실사금액과 감모 배분액을 확인하세요.');L=[qline(a,-difference),qline(+qv('consume'),difference-loss)];if(loss)L.push(qline(qa(959,'재고자산감모손실','X'),loss));}else if(i===2){const a=+qv('source'),target=+qv('target'),v=n(a);L=[qline(a,-v),qline(target,v)];}else if(i===5){const collected=n(255),credit=n(135);L=[qline(255,collected),qline(135,-credit)];const diff=collected-credit;if(diff)L.push(qline(diff>0?qa(261,'미지급세금','L'):120,-diff));}else if(i===6){if(C().type!=='법인')throw Error('법인세 단계는 법인 회사용입니다. 개인은 수기 확인 처리하세요.');const tax=qn('tax'),pre=qn('prepaid');if(tax<0||pre<0||pre>tax)throw Error('상계액은 확정세액 이내여야 합니다.');L=[qline(qa(998,'법인세비용','X'),tax),qline(qa(1400,'미지급법인세','L'),-(tax-pre))];if(pre)L.push(qline(qa(1101,'선급법인세','A'),-pre));}else if(i===7){if(C().type==='법인')throw Error('법인은 해당없음으로 수기 확인하세요.');qa(338,'인출금','E');qa(337,'출자금','E');const signed=(m[338]?.d||0)-(m[338]?.c||0);L=[qline(338,-signed),qline(337,signed)];}else if(i===8){C().accounts.filter(a=>'RX'.includes(a.type)).forEach(a=>{const o=m[a.code];if(o&&o.d!==o.c)L.push(qline(a.code,o.c-o.d))});const diff=L.reduce((s,l)=>s+l.d-l.c,0),equity=C().type==='법인'?375:qa(337,'출자금','E');if(diff)L.push(qline(equity,-diff));}else if(i===9){let next=C().periods.find(p=>p.s>pr().e);if(!next){const last=pr(),d=pd(last.e);d.setDate(d.getDate()+1);next=mkP(last.no+1,d.getFullYear(),d.getMonth()+1);C().periods.push(next)}st.carry={next:next.no,at:pr().e,balances:Object.fromEntries(C().accounts.filter(a=>'ALE     if (NINV.test(a.name)) return NINVST.test(a.name) ? 'INV' : (/투자|장기|보증금|전세금|출자|투자주식/.test(a.name) ? 'TIV' : (/영업권|특허|상표|저작권|무형|실시권/.test(a.name) ? 'INT' : 'TAN'));
    return NINVST.test(a.name) ? 'INV' : 'CA';
  }
  function liabSection(a){ return /사채|장기|퇴직/.test(a.name) ? 'NL' : 'CL'; }

  function accumulate(m, kind){
    const out = {};
    const put = (sec, label, v) => { out[sec] = out[sec] || {}; out[sec][label] = (out[sec][label] || 0) + v; };
    accts().forEach(a => {
      if (a.type === 'A') { const s = assetSection(a); put(s, bucket(RE[s === 'CA' ? 'ca' : s === 'INV' ? 'inv' : s === 'TIV' ? 'tiv' : s === 'TAN' ? 'tan' : 'intg'], a.name), val(a, m)); }
      else if (a.type === 'L') { const s = liabSection(a); put(s, bucket(RE[s === 'CL' ? 'cl' : 'nl'], a.name), val(a, m)); }
      else if (a.type === 'E') { put('EQ', bucket(RE.eq, a.name), val(a, m)); }
    });
    return out;
  }

  const SGA_SPEC = [
    ['1. 급여', /급여|임금|상여|수당|인건비/], ['2. 퇴직급여', /퇴직/], ['3. 복리후생비', /복리후생|식대|경조|직원/],
    ['4. 여비교통비', /여비|교통/], ['5. 접대비', /접대/], ['6. 통신비', /통신|전화|인터넷/],
    ['7. 수도광열비', /수도|광열|가스/], ['8. 전력비', /전력/], ['9. 세금과공과', /세금과공과|공과금|면허세|자동차세|재산세|주민세/],
    ['10. 감가상각비', /감가상각/], ['11. 지급임차료', /임차/], ['12. 수선비', /수선/], ['13. 보험료', /보험/],
    ['14. 차량유지비', /차량|유류|주유/], ['15. 운반비', /운반/], ['16. 교육훈련비', /교육|훈련|연수/],
    ['17. 도서인쇄비', /도서|인쇄/], ['18. 회의비', /회의/], ['19. 사무용품비', /사무용품|사무실|문구/],
    ['20. 소모품비', /소모품/], ['21. 지급수수료', /수수료|용역/], ['22. 광고선전비', /광고|선전|홍보/],
    ['23. 대손상각비', /대손/], ['24. 기타', null]
  ];
  function sgaAgg(sga){
    const out = SGA_SPEC.map(x => [x[0], 0]);
    sga.forEach(function(pair){
      const nm = pair[0].name, v = pair[1]; let hit = -1;
      for (let i = 0; i < SGA_SPEC.length - 1; i++) { if (SGA_SPEC[i][1].test(nm)) { hit = i; break; } }
      out[hit < 0 ? out.length - 1 : hit][1] += v;
    });
    return out;
  }

  /* ---------- 공통 서식 헤더 ---------- */
  function biz(k){ const b = C().biz || {}; return b[k] || ''; }
  function head(formNo, title, kind){
    const p = pr(); const c = C();
    const no = biz('no') || biz('bizNo') || biz('num') || '';
    const nm = c.name || '';
    return `<div class="stdf-top"><span class="stdf-no">${formNo}</span><b>${title}</b><span class="stdf-period">${kind === 'flow' ? p.name : '기준일 ' + FS.e}</span></div>
    <table class="stdf-h"><tr><th>법인명(상호)</th><td>${e(nm)}</td><th>사업자등록번호</th><td>${e(no)}</td></tr>
    <tr><th>사업연도</th><td>${FS.s} ~ ${FS.e}</td><th>단위</th><td>원 (₩)</td></tr></table>`;
  }
  function sign(){
    return `<div class="stdf-sign"><span>위 금액은 ${C().type === '법인' ? '법인세법 시행규칙' : '소득세법 시행규칙'}에 따른 표준서식에 의하여 작성한 것입니다.</span>
    <span>${new Date().getFullYear()}년&nbsp;&nbsp;&nbsp;월&nbsp;&nbsp;&nbsp;일&nbsp;&nbsp;&nbsp;&nbsp;작성자 ${C().type === '법인' ? '대표자' : '납세자'} <i class="stdf-seal">(인)</i></span></div>`;
  }
  function note(t){ return `<div class="stdf-note">${t}</div>`; }

  /* ---------- 표준재무상태표 ---------- */
  window.bs = function(){
    fsReset();
    const m = stock(FS.e);
    const B = accumulate(m, 'stock');
    const ni = (function(){ const r = {}; let R = 0, X = 0; accts().forEach(a => { if (a.type === 'R') R += val(a, m); if (a.type === 'X') X += val(a, m); }); return R - X; })();
    const S = (sec, lab) => (B[sec] && B[sec][lab]) || 0;
    const sum = o => Object.values(o || {}).reduce((s, v) => s + v, 0);
    const assets = sum(B.CA) + sum(B.INV) + sum(B.TIV) + sum(B.TAN) + sum(B.INT);
    const liab = sum(B.CL) + sum(B.NL);
    const eq = sum(B.EQ) + ni;

    const rows = [];
    const L = (lab, v, lvl, cls) => rows.push(`<tr class="${cls || ''}"><td class="stdf-l lv${lvl}">${lab}</td><td class="n">${v === null ? '' : P(v)}</td></tr>`);
    const item = (lab, v) => { L(lab, v ? v : null, 3); };

    L('【자 산】', null, 0, 'stdf-cap');
    L('Ⅰ. 유동자산', null, 1, 'stdf-g1');
    L('1. 당좌자산', null, 2, 'stdf-g2'); RE.ca.forEach(([lab]) => item(lab, S('CA', lab)));
    L('2. 재고자산', null, 2, 'stdf-g2'); RE.inv.forEach(([lab]) => item(lab, S('INV', lab)));
    L('Ⅱ. 비유동자산', null, 1, 'stdf-g1');
    L('1. 투자자산', null, 2, 'stdf-g2'); RE.tiv.forEach(([lab]) => item(lab, S('TIV', lab)));
    L('2. 유형자산', null, 2, 'stdf-g2'); RE.tan.forEach(([lab]) => item(lab, S('TAN', lab)));
    L('3. 무형자산', null, 2, 'stdf-g2'); RE.intg.forEach(([lab]) => item(lab, S('INT', lab)));
    L('자 산 총 계', assets, 0, 'stdf-tot');
    L('【부 채】', null, 0, 'stdf-cap');
    L('Ⅰ. 유동부채', null, 1, 'stdf-g1'); RE.cl.forEach(([lab]) => item(lab, S('CL', lab)));
    L('Ⅱ. 비유동부채', null, 1, 'stdf-g1'); RE.nl.forEach(([lab]) => item(lab, S('NL', lab)));
    L('부 채 총 계', liab, 0, 'stdf-tot');
    L('【자 본】', null, 0, 'stdf-cap');
    RE.eq.forEach(([lab]) => item(lab, S('EQ', lab)));
    item('당기순이익(손실)', ni);
    L('자 본 총 계', eq, 0, 'stdf-tot');
    L('부채와 자본 총계', liab + eq, 0, 'stdf-gt');

    const ok = Math.abs(assets - (liab + eq)) < 1;
    FSX = { n: '표준재무상태표', a: [['과목','금액'],['자산총계',assets],['부채총계',liab],['자본총계',eq],['부채와자본총계',liab+eq]] };
    return fsbar('bs') + `<div class="stdf">${head('■ 법인세법 시행규칙 별지 제3호서식 · 소득세법 시행규칙 별지 제40호서식', '표 준 재 무 상 태 표', 'stock')}
    <table class="stdf-t"><thead><tr><th class="stdf-l">과&nbsp;&nbsp;목</th><th class="stdf-amt">금&nbsp;&nbsp;액</th></tr></thead><tbody>${rows.join('')}</tbody></table>
    <div class="${ok ? 'ok' : 'bad'} stdf-chk">${ok ? '✓ 자산총계 = 부채총계 + 자본총계 (일치)' : '⚠ 자산총계와 부채·자본총계가 ' + P(Math.abs(assets - (liab + eq))) + '원 차이 — 최초잔액·분개를 검산하세요.'}</div>
    ${sign()}</div>` + note('과목 더블클릭 없이 표준서식 그대로 출력됩니다. 세부 내역은 [합계재무상태표]·[총계정원장]에서 확인하세요.') + drillPop();
  };

  /* ---------- 표준손익계산서 ---------- */
  window.pnl = function(){
    fsReset();
    const m = rng(FS.s, FS.e);
    const sales = [], cogs = [], sga = [], nr = [], nx = [], tax = [];
    accts().forEach(a => {
      const v = flowv(a, m);
      if (!v) return;
      if (a.type === 'R') { (/매출/.test(a.name) && a.code < 900) ? sales.push([a, v]) : nr.push([a, v]); }
      else if (a.type === 'X') {
        if (/법인세|법인세비용/.test(a.name)) tax.push([a, v]);
        else if (a.code < 500 || /원가/.test(a.name)) cogs.push([a, v]);
        else if (a.code >= 900) nx.push([a, v]);
        else sga.push([a, v]);
      }
    });
    const T = arr => arr.reduce((s, x) => s + x[1], 0);
    const SA = T(sales), CO = T(cogs), SG = T(sga), NR = T(nr), NX = T(nx), TX = T(tax);
    const GP = SA - CO, OP = GP - SG, ORD = OP + NR - NX, NET = ORD - TX;

    const rows = [];
    const L = (lab, v, cls, lvl) => rows.push(`<tr class="${cls || ''}"><td class="stdf-l lv${lvl || 0}">${lab}</td><td class="n">${v === null ? '' : P(v)}</td></tr>`);
    const detail = arr => arr.forEach(([a, v]) => L(`${a.name}`, v, 'stdf-d', 3));

    L('Ⅰ. 매출액', SA, 'stdf-g1'); detail(sales.sort((x, y) => x[0].code - y[0].code));
    L('Ⅱ. 매출원가', CO, 'stdf-g1'); detail(cogs.sort((x, y) => x[0].code - y[0].code));
    L('Ⅲ. 매출총손익', GP, 'stdf-tot');
    L('Ⅳ. 판매비와 관리비', SG, 'stdf-g1');
    sgaAgg(sga).forEach(function(it){ L(it[0], it[1] ? it[1] : null, 'stdf-d', 3); });
    L('Ⅴ. 영업손익', OP, 'stdf-tot');
    L('Ⅵ. 영업외수익', NR, 'stdf-g1'); detail(nr.sort((x, y) => x[0].code - y[0].code));
    L('Ⅶ. 영업외비용', NX, 'stdf-g1'); detail(nx.sort((x, y) => x[0].code - y[0].code));
    L('Ⅷ. 법인세비용차감전순손익', ORD, 'stdf-tot');
    L('Ⅸ. 법인세비용', TX, 'stdf-g1'); detail(tax);
    L('Ⅹ. 당기순손익', NET, 'stdf-gt');

    FSX = { n: '표준손익계산서', a: [['과목', '금액'], ['매출액', SA], ['매출원가', CO], ['매출총손익', GP], ['판매비와관리비', SG], ['영업손익', OP], ['영업외수익', NR], ['영업외비용', NX], ['법인세비용차감전순손익', ORD], ['법인세비용', TX], ['당기순손익', NET]] };
    return fsbar('pl') + `<div class="stdf">${head('■ 법인세법 시행규칙 별지 제4호서식 · 소득세법 시행규칙 별지 제41호서식', '표 준 손 익 계 산 서', 'flow')}
    <table class="stdf-t"><thead><tr><th class="stdf-l">과&nbsp;&nbsp;목</th><th class="stdf-amt">금&nbsp;&nbsp;액</th></tr></thead><tbody>${rows.join('')}</tbody></table>
    ${sign()}</div>` + note('Ⅰ~Ⅹ 항목은 표준손익계산서 체계 그대로입니다. 매출원가는 코드 500 미만·‘원가’ 계정, 판매비와 관리비는 코드 800번대, 영업외비용은 900 이상으로 자동 분류됩니다.') + drillPop();
  };

  /* ---------- 표준합계잔액시산표 ---------- */
  window.tb = function(){
    fsReset();
    const m = stock(FS.e);
    const rows = [];
    let TD = 0, TC = 0, BD = 0, BC = 0;
    accts().slice().sort((a, b) => a.code - b.code).forEach(a => {
      const o = m[a.code] || {d:0,c:0};
      const raw = o.d - o.c;               // 차변 초과 = 차변잔액, 대변 초과 = 대변잔액
      const bd = raw > 0 ? raw : 0, bc = raw < 0 ? -raw : 0;
      if (!o.d && !o.c) return;
      TD += o.d; TC += o.c; BD += bd; BC += bc;
      rows.push(`<tr><td class="n">${P(bd)}</td><td class="n">${P(o.d)}</td><td class="stdf-l">${a.code} ${e(a.name)}</td><td class="n">${P(o.c)}</td><td class="n">${P(bc)}</td></tr>`);
    });
    FSX = { n: '표준합계잔액시산표', a: [['차변잔액', '차변합계', '계정과목', '대변합계', '대변잔액']].concat(rows.map(r => r.replace(/<[^>]+>/g, '|').split('|').filter(Boolean).map(x => x))) };
    const ok = Math.abs(BD - BC) < 1 && Math.abs(TD - TC) < 1;
    return fsbar('bs') + `<div class="stdf">${head('■ 법인세법 시행규칙 별지 제5호서식 · 소득세법 시행규칙 별지 제42호서식', '표 준 합 계 잔 액 시 산 표', 'stock')}
    <table class="stdf-t stdf-tb5"><thead><tr><th colspan="2">차&nbsp;&nbsp;변</th><th rowspan="2" class="stdf-l">계&nbsp;&nbsp;정&nbsp;&nbsp;과&nbsp;&nbsp;목</th><th colspan="2">대&nbsp;&nbsp;변</th></tr>
    <tr><th class="stdf-amt">잔&nbsp;액</th><th class="stdf-amt">합&nbsp;계</th><th class="stdf-amt">합&nbsp;계</th><th class="stdf-amt">잔&nbsp;액</th></tr></thead>
    <tbody>${rows.join('')}<tr class="stdf-gt"><td class="n">${P(BD)}</td><td class="n">${P(TD)}</td><td class="stdf-l">합&nbsp;&nbsp;계</td><td class="n">${P(TC)}</td><td class="n">${P(BC)}</td></tr></tbody></table>
    <div class="${ok ? 'ok' : 'bad'} stdf-chk">${ok ? '✓ 차변합계 = 대변합계 (일치)' : '⚠ 차변·대변 합계가 ' + P(Math.abs(TD - TC)) + '원 차이납니다.'}</div>
    ${sign()}</div>` + note('기준일 ' + FS.e + ' 잔액 기준입니다. 법인세 신고 시 첨부하는 표준합계잔액시산표와 같은 5열 구성입니다.') + drillPop();
  };

  /* ---------- 합계재무상태표 (표준 서식 헤더 적용) ---------- */

  /* ---------- 부속명세서 ---------- */

    accts().forEach(a => {
      const v = flowv(a, m); if (!v) return;

      else if (a.type === 'X') {
        if (/법인세/.test(a.name)) return;
        if (a.code < 500 || /원가/.test(a.name)) cogs.push([a, v]);

    const sec3 = `<tr class="stdf-cap"><td colspan="3">③ 영업외수익·비용 명세서</td></tr>`

      + `<tr class="stdf-tot"><td class="stdf-l">영업외수익 합계</td><td class="n"></td><td class="n">${P(T(nr))}</td></tr>
         <tr class="stdf-tot"><td class="stdf-l">영업외비용 합계</td><td class="n"></td><td class="n">${P(T(nx))}</td></tr>`;
    FSX = { n: '부속명세서', a: [['구분', '코드', '금액'], ['매출액', '', SA], ['매출원가', '', CO], ['매출총손익', '', SA - CO], ['판매비와관리비', '', SG]] };
    return fsbar('pl') + `<div class="stdf">${head('■ 부속명세서 (법인세법 시행규칙 별지 제7호서식 준용)', '부 속 명 세 서', 'flow')}
